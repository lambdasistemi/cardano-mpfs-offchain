name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all derivations
        run: >-
          nix build --quiet
          .#offchain-tests
          .#client-tests
          .#e2e-tests
          .#cardano-mpfs-offchain
          .#mpfs-spa
          .#docker-image
          .#checks.x86_64-linux.swagger-up-to-date
          .#devShells.x86_64-linux.default.inputDerivation

  build:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and run offchain tests
        run: nix run --quiet .#unit-tests

      - name: Build and run client tests
        run: nix run --quiet .#client-unit-tests

      - name: Build offchain interfaces
        run: nix build .#cardano-mpfs-offchain --quiet

      - name: Check formatting
        run: nix run --quiet .#format-check

      - name: Lint
        run: nix run --quiet .#hlint

      - name: Build docker image
        run: nix build .#docker-image --quiet

      - name: Upload docker image
        uses: actions/upload-artifact@v6
        with:
          name: docker-image
          path: result

  e2e:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run E2E tests
        run: nix run --quiet .#e2e-tests
