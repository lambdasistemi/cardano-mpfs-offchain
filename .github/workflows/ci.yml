name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-gate:
    name: Build Gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build all derivations
        run: >-
          nix build --quiet
          .#offchain-tests
          .#client-tests
          .#e2e-tests
          .#cardano-mpfs-offchain
          .#mpfs-cli
          .#mpfs-spa
          .#docker-image
          .#checks.x86_64-linux.swagger-up-to-date
          .#devShells.x86_64-linux.default.inputDerivation

  build:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and run offchain tests
        run: nix run --quiet .#unit-tests

      - name: Build and run client tests
        run: nix run --quiet .#client-unit-tests

      - name: Build offchain interfaces
        run: nix build .#cardano-mpfs-offchain --quiet

      - name: Check formatting
        run: nix run --quiet .#format-check

      - name: Lint
        run: nix run --quiet .#hlint

      - name: Build docker image
        run: nix build .#docker-image --quiet

      - name: Upload docker image
        uses: actions/upload-artifact@v6
        with:
          name: docker-image
          path: result

  e2e:
    needs: build-gate
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run E2E tests
        run: nix run --quiet .#e2e-tests

  version-sync:
    name: Cabal version matches manifest
    runs-on: nixos
    steps:
      - uses: actions/checkout@v6
      - name: Assert Cabal versions equal release manifest
        run: |
          set -euo pipefail

          manifest_version=$(sed -n 's/.*"\.":[[:space:]]*"\([^"]*\)".*/\1/p' .release-please-manifest.json)
          if [ -z "$manifest_version" ]; then
            echo "::error::.release-please-manifest.json does not contain a root package version"
            exit 1
          fi

          pvp_version="$manifest_version"
          if [[ "$pvp_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            pvp_version="${pvp_version}.0"
          fi

          check_cabal_version() {
            cabal_file="$1"
            cabal_version=$(sed -n 's/^version:[[:space:]]*\([0-9][0-9.]*\).*/\1/p' "$cabal_file" | head -1)
            echo "manifest=$manifest_version pvp=$pvp_version $cabal_file=$cabal_version"

            if [ "$cabal_version" != "$pvp_version" ]; then
              echo "::error::$cabal_file version ($cabal_version) does not match release manifest PVP version ($pvp_version)"
              exit 1
            fi
          }

          check_cabal_version cardano-mpfs-offchain/cardano-mpfs-offchain.cabal
          check_cabal_version cardano-mpfs-cli/cardano-mpfs-cli.cabal
