site_name: Cardano MPFS Offchain
site_url: https://lambdasistemi.github.io/cardano-mpfs-offchain/
repo_url: https://github.com/lambdasistemi/cardano-mpfs-offchain

theme:
  name: material
  palette:
    # Light mode (follows OS preference on first visit, then remembers)
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.indexes
    - navigation.sections
    - navigation.path
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - swagger-ui-tag
  - asciinema-player

markdown_extensions:
  - admonition
  - tables
  - footnotes
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - CLI:
      - Overview: cli/index.md
      - Walkthrough: cli/walkthrough.md
      - Troubleshooting: cli/troubleshooting.md
  - Architecture:
      - Overview: architecture/overview.md
      - Block Processing: architecture/block-processing.md
      - Data Sources: architecture/data-sources.md
      - Singletons: architecture/singletons.md
      - Testing: architecture/testing.md
      - Dependencies: architecture/dependencies.md
      - Phase 4 Design: PHASE4-DESIGN.md
  - API Reference:
      - Swagger UI: swagger-ui.md
